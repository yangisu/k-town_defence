services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ktown
      POSTGRES_USER: ktown
      POSTGRES_PASSWORD: ktown
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ktown -d ktown"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ktown-postgres-data:/var/lib/postgresql/data

volumes:
  ktown-postgres-data:
