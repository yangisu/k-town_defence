[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ktown-defense"
version = "1.0.0"
description = "KTown Defense service"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "boto3>=1.34,<2",
    "fastapi>=0.115,<1",
    "geoalchemy2>=0.15,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]
