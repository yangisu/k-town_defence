[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ktown-defense"
version = "0.1.0"
description = "Persistent K-Town Defense tourism and check-in MVP"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.19,<2",
  "asyncpg>=0.31,<1",
  "fastapi>=0.141,<1",
  "pydantic-settings>=2.15,<3",
  "python-multipart>=0.0.22,<1",
  "sqlalchemy>=2.0.52,<3",
  "uvicorn[standard]>=0.52,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
